<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenTree - Kentsel Ekosistem Hizmetleri</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #161616; z-index: 1; }

        /* --- SOL PANEL --- */
        .sidebar {
            position: fixed; top: 20px; left: 20px; bottom: 20px; width: 320px;       
            background-color: rgba(30, 30, 30, 0.6); 
            backdrop-filter: blur(15px) saturate(180%); 
            -webkit-backdrop-filter: blur(15px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; 
            color: #e0e0e0; z-index: 1000; display: flex; flex-direction: column;
            box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }

        .sidebar-header { padding: 25px 20px 20px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background-color: rgba(0, 0, 0, 0.2); }
        .sidebar-title { margin: 0; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
        .sidebar-location { margin: 4px 0 0 0; font-size: 14px; font-weight: 600; color: #ffffff; opacity: 0.9; }
        .sidebar-subtitle { margin: 12px 0 0 0; font-size: 10px; color: #2ecc71; text-transform: uppercase; letter-spacing: 1px; line-height: 1.4; font-weight: 700; }
        .sidebar-powered { text-align: right; margin-top: 12px; font-size: 10px; color: #888888; font-style: italic; }
        .sidebar-content { padding: 20px; flex-grow: 1; overflow-y: auto; }

        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .veri-kutusu { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; text-align: center; }
        .veri-baslik { font-size: 11px; color: #aaaaaa; text-transform: uppercase; margin-bottom: 8px; }
        .veri-deger { font-size: 18px; font-weight: 600; color: #ffffff; }

        /* --- SADELEŞTİRİLMİŞ ZOOM REHBERİ --- */
        .zoom-guide {
            position: fixed; bottom: 60px; right: 60px; z-index: 1001;
            pointer-events: none; opacity: 0; transition: opacity 0.8s ease-in-out;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .pinch-container { position: relative; width: 80px; height: 80px; }
        
        .finger {
            position: absolute; width: 20px; height: 20px; 
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%; top: 50%; left: 50%;
        }

        /* Daha sakin bir animasyon */
        .finger-1 { animation: pinch-move-1 4s infinite ease-in-out; }
        .finger-2 { animation: pinch-move-2 4s infinite ease-in-out; }

        @keyframes pinch-move-1 {
            0%, 100% { transform: translate(-100%, -100%); opacity: 0.1; }
            50% { transform: translate(-20%, -20%); opacity: 0.5; }
        }
        @keyframes pinch-move-2 {
            0%, 100% { transform: translate(40%, 40%); opacity: 0.1; }
            50% { transform: translate(-20%, -20%); opacity: 0.5; }
        }

        .zoom-text { color: white; font-size: 10px; margin-top: 10px; opacity: 0.4; letter-spacing: 1px; text-align: center; }

        /* Ağaç Parlama Efekti */
        @keyframes pulse-marker {
            0% { stroke-width: 2; stroke-opacity: 0.8; }
            50% { stroke-width: 15; stroke-opacity: 0.1; }
            100% { stroke-width: 2; stroke-opacity: 0.8; }
        }
        .pulsing-marker { animation: pulse-marker 3s infinite ease-in-out; }

        /* Popup Stilleri */
        .leaflet-popup-content-wrapper { background-color: rgba(30, 30, 30, 0.9) !important; backdrop-filter: blur(10px); color: #e0e0e0 !important; border-radius: 12px; }
        .agac-popup-baslik { font-size: 15px; font-weight: 600; color: #2ecc71; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 10px; }
        .agac-popup-satir { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Project Sen-Tree</div>
            <div class="sidebar-location">📍LIFEPARK İSTANBUL</div>
            <p class="sidebar-subtitle">GIS TABANLI KENTSEL EKOSİSTEM HİZMETLERİ TAKİP SİSTEMİ</p>
            <div class="sidebar-powered">Powered by CLIMERA Projects</div>
        </div>
        <div class="sidebar-content">
            <div id="excel-verileri"></div>
        </div>
    </div>

    <div id="zoomGuide" class="zoom-guide">
        <div class="pinch-container">
            <div class="finger finger-1"></div>
            <div class="finger finger-2"></div>
        </div>
        <div class="zoom-text">BÜYÜTMEK İÇİN <br> ÇİFT PARMAK KULLANIN</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. HARİTA KURULUMU ---
        var guneyBati = L.latLng(41.1600, 28.9800); 
        var kuzeyDogu = L.latLng(41.1800, 29.0100); 
        var sinirlar = L.latLngBounds(guneyBati, kuzeyDogu);

        var map = L.map('map', { 
            zoomControl: false, attributionControl: false, 
            maxBounds: sinirlar, maxBoundsViscosity: 1.0, minZoom: 12,
            zoomSnap: 0.1, zoomDelta: 0.1
        });

        var globalAnaKatman; 

        // --- 2. VERİ YÜKLEME ---
        fetch('veri.geojson')
            .then(response => response.json())
            .then(data => {
                globalAnaKatman = L.geoJSON(data, {
                    style: { color: "darkgray", weight: 1, opacity: 0.8, fillColor: "gray", fillOpacity: 0.15 }
                }).addTo(map);
                map.fitBounds(globalAnaKatman.getBounds(), {
                    paddingTopLeft: [380, 20], paddingBottomRight: [20, 20]
                });
                setTimeout(() => { map.setZoom(map.getZoom() + 0.4); }, 500);
            });

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTd-AbM2ztRwxYmIp-58BvishVCJG3xKSQj-WgrI3_J6_ODF-zHTgM9rYmb-lI9LwRvdB0LMZFJFsn4/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true, header: false, 
            complete: function(results) {
                var veriler = results.data;
                if(veriler && veriler.length > 1) {
                    var basliklar = veriler[0]; 
                    for (var i = 1; i < veriler.length; i++) {
                        var satir = veriler[i];
                        var lat = parseFloat(satir[6]); var lng = parseFloat(satir[7]); 
                        if (!isNaN(lat) && !isNaN(lng)) {
                            var popupHTML = "<div style='min-width:200px'><h3 class='agac-popup-baslik'>Biyometrik Analiz</h3>";
                            [0,1,2,3,4,5,8].forEach(idx => {
                                if(satir[idx]) popupHTML += `<div class="agac-popup-satir"><span>${basliklar[idx]}</span><span style="font-weight:600">${satir[idx]}</span></div>`;
                            });
                            popupHTML += "</div>";

                            var marker = L.circleMarker([lat, lng], {
                                radius: 8, fillColor: "#2ecc71", color: "#2ecc71", weight: 2, fillOpacity: 0.9, className: 'pulsing-marker'
                            }).bindPopup(popupHTML).addTo(map);

                            marker.on('touchstart', function() { this.setStyle({weight: 20}); });
                            marker.on('touchend', function() { this.setStyle({weight: 2}); });
                        }
                    }
                    var panelSutunlari = [9, 10, 11, 12, 13, 14]; 
                    var sonGuncelVeri = veriler.slice().reverse().find(s => s[9]);
                    if (sonGuncelVeri) {
                        var html = '<div class="excel-kutu-container">';
                        panelSutunlari.forEach(index => {
                            html += `<div class="veri-kutusu"><div class="veri-baslik">${basliklar[index]}</div><div class="veri-deger">${sonGuncelVeri[index]}</div></div>`;
                        });
                        html += '</div>';
                        document.getElementById('excel-verileri').innerHTML = html;
                    }
                }
            }
        });

        // --- 3. REHBER VE KENDİ KENDİNE HAREKETİ ENGELLEME ---
        var idleTimer;
        var zoomGuide = document.getElementById('zoomGuide');

        function showGuide() { zoomGuide.style.opacity = "1"; }
        function hideGuide() { zoomGuide.style.opacity = "0"; }

        function resetView() {
            if (globalAnaKatman) {
                map.closePopup(); 
                // Haritayı orijinal konumuna çek
                map.fitBounds(globalAnaKatman.getBounds(), { paddingTopLeft: [380, 20], paddingBottomRight: [20, 20], animate: true });
                
                // Kendi kendine sürekli zoom yapmaması için fitBounds sonrası 
                // sadece bir kere hafif zoom ekliyoruz.
                setTimeout(() => { 
                    map.setZoom(map.getZoom() + 0.4); 
                    showGuide(); // Her şey durduğunda rehberi göster
                }, 1500);
            }
        }

        function handleInteraction() {
            hideGuide(); 
            clearTimeout(idleTimer);
            // 15 saniye dokunulmazsa resetView tetiklenir
            idleTimer = setTimeout(resetView, 15000); 
        }

        window.onload = () => {
            handleInteraction(); 
            setTimeout(showGuide, 4000); // İlk açılışta sakinleşince göster
        };
        
        // Etkileşim Dinleyicileri
        document.addEventListener('touchstart', handleInteraction, {passive: true});
        document.addEventListener('mousedown', handleInteraction);
        map.on('zoomstart', handleInteraction);
        map.on('dragstart', handleInteraction);
    </script>
</body>
</html>
