<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Lifepark Integrated GIS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* APPLE DESIGN LANGUAGE */
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #F5F5F7; overflow: hidden; 
        }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #fff; }

        /* APPLE GLASS PANEL (GLASSMORPHISM) */
        #side-panel { 
            position: absolute; top: 20px; left: 20px; width: 320px; 
            height: calc(100vh - 40px); z-index: 1000;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px; padding: 40px 30px; box-sizing: border-box;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08); 
            display: flex; flex-direction: column;
        }

        h1 { margin: 0; font-size: 26px; color: #1b5e20; font-weight: 800; letter-spacing: -1px; }
        .tagline { font-size: 11px; opacity: 0.5; margin-bottom: 40px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .card { 
            background: rgba(255, 255, 255, 0.35); border-radius: 22px; 
            padding: 22px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .label { font-size: 10px; text-transform: uppercase; opacity: 0.5; font-weight: 800; letter-spacing: 1px; color: #1b5e20; }
        .val { font-size: 34px; font-weight: 700; color: #1D1D1F; margin-top: 5px; letter-spacing: -1px; }
        .unit { font-size: 14px; font-weight: 400; opacity: 0.6; margin-left: 3px; }

        /* MARKER & POPUP STYLE */
        .apple-marker { background: #2ecc71; width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .leaflet-popup-content-wrapper { border-radius: 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .status-footer { margin-top: auto; font-size: 10px; opacity: 0.4; line-height: 1.6; }
    </style>
</head>
<body>

<div id="side-panel">
    <h1>LIFEPARK</h1>
    <div class="tagline">Akıllı CBS & Karbon Paneli</div>

    <div class="card">
        <span class="label">Toplam Karbon</span>
        <div class="val"><span id="total-co2">0.00</span><span class="unit">kg</span></div>
    </div>

    <div class="card">
        <span class="label">Varlık Sayısı</span>
        <div class="val" id="tree-count">0</div>
    </div>

    <div class="status-footer">
        ● Kaynak: harita.json<br>
        ● Senkron: Canlı Excel<br>
        ● Sistem: ClimEra Digital Twin
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
